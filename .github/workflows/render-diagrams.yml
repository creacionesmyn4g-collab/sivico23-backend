name: Render PlantUML diagrams

on:
  push:
    paths:
      - 'docs/diagrams/**.puml'
      - '.github/workflows/render-diagrams.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure output directory
        run: mkdir -p docs/diagrams/output

      - name: Render PlantUML diagrams using Docker
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work plantuml/plantuml -tpng /work/docs/diagrams/*.puml -o /work/docs/diagrams/output

      - name: Commit rendered diagrams
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(diagrams): render PlantUML diagrams"
          file_pattern: "docs/diagrams/output/*"
