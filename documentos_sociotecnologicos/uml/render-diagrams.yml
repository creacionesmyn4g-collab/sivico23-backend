name: Render PlantUML diagrams (copia)

on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure output directory
        run: mkdir -p documentos_sociotecnologicos/uml/output

      - name: Render PlantUML diagrams using Docker
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/work plantuml/plantuml -tpng /work/documentos_sociotecnologicos/uml/*.puml -o /work/documentos_sociotecnologicos/uml/output
